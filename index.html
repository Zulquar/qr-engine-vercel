<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Intelligence Engine</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --bg: #0f1117; --surface: #1a1d27; --card: #21253a; --border: #2e3248; --accent: #6c63ff; --accent2: #00d4aa; --danger: #ff4d6d; --text: #e8eaf6; --muted: #7b82a8; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
  .header { background: linear-gradient(135deg,#1a1d27,#12152a); border-bottom: 1px solid var(--border); padding: 20px 32px; display: flex; align-items: center; gap: 16px; }
  .logo { width: 42px; height: 42px; background: linear-gradient(135deg,var(--accent),var(--accent2)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .nav { display: flex; gap: 4px; padding: 16px 32px 0; border-bottom: 1px solid var(--border); background: var(--surface); }
  .tab { padding: 10px 20px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--muted); background: transparent; }
  .tab.active { color: var(--accent); background: var(--bg); border: 1px solid var(--border); border-bottom: none; }
  .main { padding: 32px; max-width: 1100px; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  input, select, textarea { width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 10px; color: white; margin-bottom: 10px; border-radius: 8px; }
  .btn { padding: 10px 22px; background: var(--accent); color: white; border: none; border-radius: 8px; cursor: pointer; }
  .qr-box img { width: 200px; background: white; padding: 10px; }
</style>
</head>
<body>
<div class="header"><div class="logo">🧠</div><h1>QR Intelligence Engine</h1></div>
<div class="nav">
  <div class="tab active" onclick="switchTab('generate',this)">⚡ Generate</div>
  <div class="tab" onclick="switchTab('learn',this)">🧠 Learn</div>
  <div class="tab" onclick="switchTab('validate',this)">✅ Validate</div>
</div>
<div class="main">
  <div class="page active" id="page-generate">
    <div class="card">
      <input type="text" id="rawText" placeholder="Enter text to QR...">
      <button class="btn" onclick="generateRaw()">Generate QR</button>
      <div id="qrOutput"></div>
    </div>
  </div>
  <div class="page" id="page-learn">
    <div class="card">
        <h3>Learn Pattern</h3>
        <input type="text" id="learnName" placeholder="Pattern Name">
        <textarea id="learnSamples" placeholder="Paste samples here..."></textarea>
        <button class="btn" onclick="learnPattern()">Save Pattern</button>
    </div>
  </div>
  <div class="page" id="page-validate">
    <div class="card">
        <h3>Validate Code</h3>
        <input type="text" id="validateInput" placeholder="Code to validate...">
        <button class="btn" onclick="validateCode()">Validate</button>
        <div id="validateResult"></div>
    </div>
  </div>
</div>
<script>
// THIS IS THE VERCEL API ROUTE
var SCRIPT_URL = '/api'; 

function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.page').forEach(p => p.style.display = 'none');
  el.classList.add('active');
  document.getElementById('page-' + name).style.display = 'block';
}
async function api(action, data) {
    let r = await fetch(SCRIPT_URL, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,data})});
    return (await r.json()).data;
}
async function generateRaw() {
  let t = document.getElementById('rawText').value;
  let d = await api('generateRaw', {text: t});
  document.getElementById('qrOutput').innerHTML = '<img src="'+d.qrDataUri+'">';
}
async function learnPattern() {
  let name = document.getElementById('learnName').value;
  let samples = document.getElementById('learnSamples').value.split('\n');
  await api('savePattern', {name, samples, codeType: 'TEMP'});
  alert('Pattern Saved!');
}
async function validateCode() {
  let code = document.getElementById('validateInput').value;
  let r = await api('validateCode', {code});
  document.getElementById('validateResult').innerHTML = 'Result: ' + (r.valid ? '✅ Valid' : '❌ Invalid');
}
</script>
</body>
</html>
